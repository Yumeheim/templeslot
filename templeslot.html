<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>架空寺</title>
<style>
  body {
    font-family: "Yu Mincho", "MS Mincho", serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    background-color: #e9e4d4;
  }
  .slot-machine {
    display: flex;
    font-size: 6rem; /* 4remの1.5倍 */
    font-weight: bold;
    background: #fff;
    padding: 22px 30px; /* 余白も約1.5倍に */
    border-radius: 8px;
    box-shadow: 0 8px 16px rgba(0,0,0,0.2);
    border: 5px solid #2c3e50;
    color: #2c3e50;
  }
  .reel {
    width: 120px; /* 80pxの1.5倍 */
    text-align: center;
    border-right: 2px dashed #ccc;
  }
  .suffix {
    width: 120px; /* 80pxの1.5倍 */
    text-align: center;
    color: #7f8c8d;
  }
  button {
    margin-top: 45px; /* 30pxの1.5倍 */
    padding: 22px 60px; /* 15px 40pxの約1.5倍 */
    font-size: 1.8rem; /* 1.2remの1.5倍 */
    cursor: pointer;
    background-color: #c0392b;
    color: white;
    border: none;
    border-radius: 5px;
    font-weight: bold;
    box-shadow: 0 4px 6px rgba(0,0,0,0.2);
  }
</style>
</head>
<body>
  <div class="slot-machine">
    <div id="reel1" class="reel">架</div>
    <div id="reel2" class="reel">空</div>
    <div class="suffix">寺</div>
  </div>
  <button id="spinButton">輪転</button>

    const kanjiList = fullJoyoKanji.split("");
    
    const reel1 = document.getElementById('reel1');
    const reel2 = document.getElementById('reel2');
    const button = document.getElementById('spinButton');
    
    let interval1, interval2;
    let isSpinning = false;

    function getRandomKanji() {
      return kanjiList[Math.floor(Math.random() * kanjiList.length)];
    }

    function startSlot() {
      isSpinning = true;
      button.textContent = "命名";
      button.style.backgroundColor = "#27ae60";
      interval1 = setInterval(() => { reel1.textContent = getRandomKanji(); }, 50);
      interval2 = setInterval(() => { reel2.textContent = getRandomKanji(); }, 50);
    }

    function stopSlot() {
      clearInterval(interval1);
      setTimeout(() => {
        clearInterval(interval2);
        isSpinning = false;
        button.textContent = "輪転";
        button.style.backgroundColor = "#c0392b";
      }, 500);
    }

    button.addEventListener('click', () => {
      if (isSpinning) { stopSlot(); } else { startSlot(); }
    });
  </script>
</body>
</html>
