<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>架空寺</title>
<style>
* { box-sizing: border-box; }
body { font-family: "Yu Mincho", "MS Mincho", serif; margin: 0; background: #e9e4d4; color: #2c3e50; }
main { min-height: 100svh; width: min(100%, 620px); margin: auto; padding: 40px 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; }
h1 { font-size: 1.2rem; letter-spacing: .3em; margin: 0; }
.slot-machine { display: flex; width: 100%; max-width: 440px; font-size: clamp(3rem, 16vw, 6rem); font-weight: bold; background: white; padding: 22px 18px; border-radius: 8px; box-shadow: 0 8px 16px #0003; border: 5px solid #2c3e50; }
.reel, .suffix { flex: 1; text-align: center; }
.reel { border-right: 2px dashed #ccc; }
.suffix { color: #7f8c8d; }
.controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
button, .share { font: inherit; font-weight: bold; padding: 12px 18px; cursor: pointer; background: #fff9; color: #2c3e50; border: 1px solid #899286; border-radius: 5px; text-decoration: none; text-align: center; }
#spinButton { font-size: 1.8rem; padding: 18px 55px; background: #c0392b; color: white; border: 0; box-shadow: 0 4px 6px #0003; }
#spinButton[data-spinning="true"] { background: #27804b; }
button[aria-pressed="true"] { background: #2c3e50; color: white; }
button:disabled { opacity: .5; cursor: default; }
a[aria-disabled="true"] { opacity: .5; cursor: default; }
button:focus-visible, a:focus-visible { outline: 3px solid #276fa1; outline-offset: 4px; }
p { margin: 0; line-height: 1.8; }
.note { font-size: .85rem; color: #536052; text-align: center; }
#status { min-height: 1.8em; text-align: center; }
section { width: 100%; max-width: 440px; border-top: 1px solid #a5ab9d; padding-top: 20px; }
h2 { font-size: 1.1rem; margin: 0 0 12px; }
ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
li { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px; background: #ffffff70; border-radius: 5px; }
li strong { flex: 1; font-size: 1.3rem; }
li button, li a { font-size: .85rem; padding: 8px 12px; }
</style>
</head>
<body>
<main>
<h1>架空寺</h1>
<div class="slot-machine" aria-label="寺名のリール">
<div id="reel1" class="reel">架</div><div id="reel2" class="reel">空</div><div class="suffix">寺</div>
</div>
<button id="spinButton" type="button">輪転</button>
<div class="controls">
<button id="autoButton" type="button" aria-pressed="false">自動輪転</button>
<button id="favoriteButton" type="button" aria-pressed="false">●御朱印</button>
<a id="shareButton" class="share" target="_blank" rel="noopener noreferrer">布教(Xに投稿)</a>
</div>
<p id="status" role="status" aria-live="polite">輪転で回し、命名で止められよ。</p>
<p class="note">自動輪転は1秒回転し、命名後に1.5秒待たれよ。<br>御朱印の拝受・布教の際は輪転を止める。</p>
<section aria-labelledby="favoritesTitle">
<h2 id="favoritesTitle">御朱印帳 <span id="favoriteCount">0</span></h2>
<p class="note">閲覧した者の経典に記される。記憶を失えば消え失せる。</p>
<p id="storageNotice" class="note" role="status"></p>

<ul id="favoritesList"></ul>
</section>
</main>
<script>
'use strict';
const fullJoyoKanji = "亜哀挨愛曖悪握圧扱宛嵐安案暗以衣位囲医依委威為畏胃尉異移萎偉椅彙意違維慰遺緯域育一壱逸茨芋引印因咽姻員院淫陰飲隠韻右宇羽雨唄鬱畝浦運雲永泳英映栄営詠影鋭衛易疫益液駅悦越謁閲円延沿炎怨宴媛援園煙猿遠鉛塩演縁艶汚王凹央応往押旺欧殴桜翁奥横岡屋億憶臆虞乙俺卸音恩温穏下化火加可仮何花佳価果河苛科架夏家荷華菓貨渦過嫁暇禍靴寡歌箇稼課蚊牙瓦我画芽賀雅餓介回灰会快戒改怪拐悔海界皆械絵開階塊楷解潰壊懐諧貝外劾害崖涯街慨蓋該概骸垣柿各角拡革格核殻郭覚較隔閣確獲嚇穫学岳楽額顎掛潟括活喝渇割葛滑褐轄且株釜鎌刈干刊甘汗缶完肝官冠巻看陥乾勘患貫寒喚堪換敢棺款間閑勧寛幹感漢慣管関歓監緩憾還館環簡観韓艦鑑丸含岸岩玩眼頑顔願企伎危机気岐希忌汽奇祈季紀軌既記起飢鬼帰基寄著規亀喜幾揮期棋貴棄毀旗器機騎技宜偽欺義疑儀戯擬犠菊吉喫詰却客脚逆虐九久及弓丘旧休吸朽臼求究泣急級糾宮救球給嗅窮牛去巨居拒拠挙虚許距魚御漁凶共叫狂京享供協況峡挟狭恐恭胸脅強教郷境橋矯鏡競響驚仰暁業凝曲局極玉巾斤均近金菌勤琴筋僅禁緊錦謹襟吟銀区句苦駆具愚空偶遇隅串屈掘窟熊繰君訓勲薫軍郡群兄刑形系径泥恵慶慧憩掲携敬景渓系経継茎蛍計警軽鶏芸迎鯨劇撃激隙桁欠穴血決結傑潔月犬件見券肩建研県倹兼剣拳軒健険圏堅検嫌献絹遣権憲賢謙鍵繭顕験懸元幻玄言弦限原現舷減源厳己戸古呼固股虎孤弧故枯個庫湖雇誇鼓錮顧五互午後語誤護交侯候光公功効厚口向后坑好孔孝宏工巧幸広交康弘恒慌抗拘控攻更校構江洪狡甲皇硬稿紅絞綱耕考肯腕宛嵐安案暗以衣位囲医依委威為畏胃尉異移萎偉椅彙意違維慰遺緯域育一壱逸茨芋引印因咽姻員院淫陰飲隠韻右宇羽雨唄鬱畝浦運雲永泳英映栄営詠影鋭衛易疫益液駅悦越謁閲円延沿炎怨宴媛援園煙猿遠鉛塩演縁艶汚王凹央応往押旺欧殴桜翁奥横岡屋億憶臆虞乙俺卸音恩温穏下化火加可仮何花佳価果河苛科架夏家荷華菓貨渦過嫁暇禍靴寡歌箇稼課蚊牙瓦我画芽賀雅餓介回灰会快戒改怪拐悔海界皆械絵開階塊楷解潰壊懐諧貝外劾害崖涯街慨蓋該概骸垣柿各角拡革格核殻郭覚較隔閣確獲嚇穫学岳楽額顎掛潟括活喝渇割葛滑褐轄且株釜鎌刈干刊甘汗缶完肝官冠巻看陥乾勘患貫寒喚堪換敢棺款間閑勧寛幹感漢慣管関歓監緩憾還館環簡観韓艦鑑丸含岸岩玩眼頑顔願企伎危机気岐希忌汽奇祈季紀軌既記起飢鬼帰基寄著規亀喜幾揮期棋貴棄毀旗器機騎技宜偽欺義疑儀戯擬犠菊吉喫詰却客脚逆虐九久及弓丘旧休吸朽臼求究泣急級糾宮救球給嗅窮牛去巨居拒拠挙虚許距魚御漁凶共叫狂京享供協況峡挟狭恐恭胸脅強教郷境橋矯鏡競響驚仰暁業凝曲局極玉巾斤均近金菌勤琴筋僅禁緊錦謹襟吟銀区句苦駆具愚空偶遇隅串屈掘窟熊繰君訓勲薫軍郡群兄刑形系径泥恵慶慧憩掲携敬景渓系経継茎蛍計警軽鶏芸迎鯨劇撃激隙桁欠穴血決結傑潔月犬件見券肩建研県倹兼剣拳軒健険圏堅検嫌献絹遣権憲賢謙鍵繭顕験懸元幻玄言弦限原現舷減源厳己戸古呼固股虎孤弧故枯個庫湖雇誇鼓錮顧五互午後語誤護交侯候光公功効厚口向后坑好孔孝宏工巧幸広交康弘恒慌抗拘控攻更校構江洪狡甲皇硬稿紅絞綱耕考肯腕";
const kanjiList = fullJoyoKanji.split('');
const $ = id => document.getElementById(id);
const reel1 = $('reel1'), reel2 = $('reel2');
const spinButton = $('spinButton'), autoButton = $('autoButton');
const favoriteButton = $('favoriteButton'), shareButton = $('shareButton');
const STORAGE_KEY = 'kakuji.favorites.v1';
const AUTO_ROTATION_MS = 1000;
const AUTO_PAUSE_MS = 1500;
const REEL_STOP_DELAY_MS = 500;
let favorites = [];
let state = 'idle', auto = false, currentName = '架空寺';
let interval1, interval2, stopTimer, autoStopTimer, nextTimer;
function validName(value) { return typeof value === 'string' && /^[\u3400-\u9fff]{2}寺$/u.test(value); }
function loadFavorites() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    if (!Array.isArray(saved)) throw new Error('Invalid data');
    favorites = [...new Set(saved.filter(validName))];
  } catch {
    $('storageNotice').textContent = '保存データを読み込めません。この画面では引き続き利用できます。';
  }
}
function persist(next) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
    favorites = next;
    $('storageNotice').textContent = '';
    return true;
  } catch {
    $('storageNotice').textContent = '保存できませんでした。ブラウザの保存設定や空き容量をご確認ください。';
    return false;
  }
}
function shareUrl(name) {
  const intent = new URL('https://twitter.com/intent/tweet');
  intent.searchParams.set('text', `命名：${name} #架空寺`);
  intent.searchParams.set('url', 'https://templeslot-tua3.vercel.app/');
  return intent.href;
}
function syncControls() {
  const idle = state === 'idle';
  spinButton.disabled = state === 'stopping';
  spinButton.textContent = idle ? '輪転' : state === 'stopping' ? '命名中…' : '命名';
  spinButton.dataset.spinning = String(!idle);
  favoriteButton.disabled = !idle;
  const saved = favorites.includes(currentName);
  favoriteButton.textContent = saved ? '●拝受済み' : '●御朱印';
  favoriteButton.setAttribute('aria-pressed', String(saved));
  shareButton.setAttribute('aria-disabled', String(!idle));
  if (idle) shareButton.href = shareUrl(currentName);
  else shareButton.removeAttribute('href');
  autoButton.textContent = auto ? '輪転停止' : '自動輪転';
  autoButton.setAttribute('aria-pressed', String(auto));
}
function setAuto(value) {
  auto = value;
  clearTimeout(autoStopTimer); clearTimeout(nextTimer);
  syncControls();
}
function randomKanji() { return kanjiList[Math.floor(Math.random() * kanjiList.length)]; }
function startSlot() {
  if (state !== 'idle') return;
  state = 'spinning';
  $('status').textContent = auto ? '自動輪転中…' : '「命名」で止められよ。';
  interval1 = setInterval(() => { reel1.textContent = randomKanji(); }, 50);
  interval2 = setInterval(() => { reel2.textContent = randomKanji(); }, 50);
  syncControls();
  if (auto) autoStopTimer = setTimeout(stopSlot, AUTO_ROTATION_MS - REEL_STOP_DELAY_MS);
}
function stopSlot() {
  if (state !== 'spinning') return;
  state = 'stopping'; clearTimeout(autoStopTimer); clearInterval(interval1);
  syncControls();
  stopTimer = setTimeout(() => {
    clearInterval(interval2);
    state = 'idle'; currentName = reel1.textContent + reel2.textContent + '寺';
    $('status').textContent = `命名：${currentName}`;
    syncControls();
    if (auto) nextTimer = setTimeout(startSlot, AUTO_PAUSE_MS);
  }, REEL_STOP_DELAY_MS);
}
function renderFavorites() {
  $('favoritesList').replaceChildren();
  $('favoriteCount').textContent = String(favorites.length);
  for (const name of favorites) {
    const row = document.createElement('li');
    const label = document.createElement('strong'); label.textContent = name;
    const share = document.createElement('a'); share.className = 'share';
    share.textContent = '布教(Xに投稿)'; share.href = shareUrl(name);
    share.target = '_blank'; share.rel = 'noopener noreferrer';
    share.setAttribute('aria-label', `${name}を布教(Xに投稿)`);
    share.addEventListener('click', pauseForAction);
    const remove = document.createElement('button'); remove.type = 'button'; remove.textContent = '削除';
    remove.setAttribute('aria-label', `${name}を御朱印帳から削除`);
    remove.addEventListener('click', () => {
      if (persist(favorites.filter(item => item !== name))) {
        renderFavorites(); syncControls(); $('status').textContent = `${name}を御朱印帳から消した。`;
      }
    });
    row.append(label, share, remove); $('favoritesList').append(row);
  }
}
function pauseForAction() { setAuto(false); if (state === 'spinning') stopSlot(); }
spinButton.addEventListener('click', () => {
  setAuto(false);
  if (state === 'idle') startSlot(); else stopSlot();
});
autoButton.addEventListener('click', () => {
  setAuto(!auto);
  if (auto) {
    if (state === 'idle') startSlot();
    else if (state === 'spinning') autoStopTimer = setTimeout(stopSlot, AUTO_ROTATION_MS - REEL_STOP_DELAY_MS);
  } else {
    if (state === 'spinning') stopSlot();
    if (state === 'idle') $('status').textContent = `輪転停止：${currentName}`;
  }
});
favoriteButton.addEventListener('click', () => {
  if (state !== 'idle') return;
  pauseForAction();
  if (favorites.includes(currentName)) return;
  if (persist([currentName, ...favorites])) {
    renderFavorites(); syncControls(); $('status').textContent = `${currentName}の御朱印を拝受した。`;
  }
});
shareButton.addEventListener('click', event => {
  if (state !== 'idle') { event.preventDefault(); return; }
  pauseForAction();
});
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseForAction(); });
window.addEventListener('pagehide', () => {
  setAuto(false); clearInterval(interval1); clearInterval(interval2); clearTimeout(stopTimer);
  state = 'idle'; reel1.textContent = currentName[0]; reel2.textContent = currentName[1]; syncControls();
});
window.addEventListener('storage', event => {
  if (event.key === STORAGE_KEY || event.key === null) { loadFavorites(); renderFavorites(); syncControls(); }
});
loadFavorites(); renderFavorites(); syncControls();
</script>
</body>
</html>
